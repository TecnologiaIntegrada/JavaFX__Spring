services:
  postgres:
    image: postgres:16-alpine
    container_name: projeto-j-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: projeto_j
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - projeto_j_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  projeto_j_pgdata:
